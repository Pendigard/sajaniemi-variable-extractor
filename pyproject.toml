[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sajaniemi-variable-extractor"
version = "0.1.0"
description = "Joern-based extractor for Sajaniemi variable roles"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}

[project.scripts]
sajaniemi-variable-extractor = "sajaniemi_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sajaniemi_extractor*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/sajaniemi-variable-extractor/scala" = ["src/scala/*.sc"]
"share/sajaniemi-variable-extractor/scala/facts" = ["src/scala/facts/*.sc"]
"share/sajaniemi-variable-extractor/scala/pipeline" = ["src/scala/pipeline/*.sc"]
